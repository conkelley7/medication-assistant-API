services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medicationassistant}
      POSTGRES_USER: ${POSTGRES_USER:-medicationassistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-medicationassistant} -d ${POSTGRES_DB:-medicationassistant}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  application:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod

      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-medicationassistant}
      DB_USERNAME: ${POSTGRES_USER:-medicationassistant}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      OPEN_AI_API_KEY: ${OPEN_AI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}

volumes:
  postgres-data: