spring.application.name=medicationassistant
spring.profiles.default=local

spring.ai.openai.api-key=${OPEN_AI_API_KEY}
spring.ai.openai.model=gpt-3.5-turbo

medicationassistant.jwtsecret=${JWT_SECRET}

# OpenAI Feign timeouts, in milliseconds
spring.cloud.openfeign.client.config.openAiClient.connect-timeout=2000
spring.cloud.openfeign.client.config.openAiClient.read-timeout=10000

# OpenAI circuit breaker
resilience4j.circuitbreaker.instances.openAi.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.openAi.sliding-window-size=10
resilience4j.circuitbreaker.instances.openAi.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.openAi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.openAi.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.openAi.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.openAi.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.openAi.register-health-indicator=true
resilience4j.circuitbreaker.instances.openAi.record-exceptions=feign.RetryableException,feign.FeignException$FeignServerException,com.kelley.medicationassistant.exception.ExternalServiceException

# OpenAI retry
resilience4j.retry.instances.openAi.max-attempts=3
resilience4j.retry.instances.openAi.wait-duration=500ms
resilience4j.retry.instances.openAi.enable-exponential-backoff=true
resilience4j.retry.instances.openAi.exponential-backoff-multiplier=2
resilience4j.retry.instances.openAi.retry-exceptions=feign.RetryableException,feign.FeignException$FeignServerException,com.kelley.medicationassistant.exception.ExternalServiceException

